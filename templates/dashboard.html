<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Herd Watch — Goat Collar Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

<div class="contour-bg" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">⟡</span>
    <div class="brand-text">
      <h1>Herd Watch</h1>
      <p>Live collar telemetry — GPS · heart rate · temperature</p>
    </div>
  </div>

  <div class="herd-stats" id="herd-stats">
    <div class="stat">
      <span class="stat-value" id="stat-total">–</span>
      <span class="stat-label">collars reporting</span>
    </div>
    <div class="stat stat--ok">
      <span class="stat-value" id="stat-ok">–</span>
      <span class="stat-label">grazing steady</span>
    </div>
    <div class="stat stat--warning">
      <span class="stat-value" id="stat-warning">–</span>
      <span class="stat-label">worth a look</span>
    </div>
    <div class="stat stat--alert">
      <span class="stat-value" id="stat-alert">–</span>
      <span class="stat-label">needs attention</span>
    </div>
  </div>

  <div class="last-sync">
    <span class="dot" id="sync-dot"></span>
    <span id="sync-label">connecting…</span>
  </div>
</header>

<main class="layout">

  <section class="map-panel">
    <div id="map"></div>
  </section>

  <aside class="herd-list" id="herd-list" aria-label="Herd list">
    <div class="herd-list-header">
      <h2>The herd</h2>
      <span class="hint">tap a goat for detail</span>
    </div>
    <div id="goat-cards" class="goat-cards">
      <!-- populated by dashboard.js -->
    </div>
  </aside>

</main>

<section class="detail-drawer" id="detail-drawer" aria-hidden="true">
  <div class="drawer-inner">
    <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
    <div class="drawer-head">
      <h2 id="drawer-title">—</h2>
      <span class="pill" id="drawer-status">unknown</span>
    </div>

    <div class="drawer-metrics">
      <div class="metric">
        <span class="metric-label">Body temp</span>
        <span class="metric-value" id="drawer-temp">–</span>
      </div>
      <div class="metric">
        <span class="metric-label">Heart rate</span>
        <span class="metric-value" id="drawer-hr">–</span>
      </div>
      <div class="metric">
        <span class="metric-label">Battery</span>
        <span class="metric-value" id="drawer-batt">–</span>
      </div>
      <div class="metric">
        <span class="metric-label">Last fix</span>
        <span class="metric-value metric-value--mono" id="drawer-coords">–</span>
      </div>
    </div>

    <div class="drawer-charts">
      <div class="chart-block">
        <h3>Heart rate — last 24h</h3>
        <canvas id="chart-hr" height="90"></canvas>
      </div>
      <div class="chart-block">
        <h3>Body temperature — last 24h</h3>
        <canvas id="chart-temp" height="90"></canvas>
      </div>
    </div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
